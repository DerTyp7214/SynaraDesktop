name: Build and Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  build:
    name: Build for ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Install ImageMagick
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            brew install imagemagick
          elif [ "${{ matrix.os }}" = "windows-latest" ]; then
            choco install imagemagick.app
          fi

      - name: Build Distributions
        run: ./gradlew :app:packageDistributionForCurrentOS :classic:packageDistributionForCurrentOS

      - name: Build Linux Tarballs and Arch Packages
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          ./gradlew :app:createReleaseDistributable :classic:createReleaseDistributable

          VERSION=$(./gradlew :synara:properties -q | grep "^version:" | cut -d' ' -f2 | tr -d '\r')
          [ -z "$VERSION" ] && VERSION="1.0.0"

          APP_PKGVER="$(echo "$VERSION" | tr '-' '_').r${RUN_NUMBER}"
          STAMP=$(date -u +%Y%m%d.%H%M%S)

          ROOT=$PWD
          APP_IMAGE=$ROOT/app/build/compose/binaries/main-release/app/Synara
          CLASSIC_IMAGE=$ROOT/classic/build/compose/binaries/main-release/app/Synara
          ICON_PNG=$ROOT/synara/src/commonMain/resources/icon.png
          ICON_SVG=$ROOT/synara/src/commonMain/resources/icon.svg
          STAGE=$ROOT/arch-stage
          PREV=$ROOT/arch-prev
          OUT=$ROOT/arch-out
          OWN_JAR_RE='^(app|classic|synara|common-rpc|tray|dbus-api)-jvm(-[^/]*)?\.jar$'
          rm -rf "$STAGE" "$PREV" "$OUT"
          mkdir -p "$STAGE" "$PREV" "$OUT"
          : > "$OUT/reused-packages.txt"
          ./gradlew -q :synara:printReleaseVersion | tr -d '\r' > "$OUT/release-version.txt"

          set_install_channel() {
            local cfg=$1 channel=$2
            if ! grep -qxF 'java-options=-Dsynara.installChannel=deb' "$cfg"; then
              echo "::error::$cfg has no java-options=-Dsynara.installChannel=deb line"
              exit 1
            fi
            sed -i "s/^java-options=-Dsynara\.installChannel=deb\$/java-options=-Dsynara.installChannel=$channel/" "$cfg"
          }

          make_tarball() {
            local image=$1 tarball=$2 copy="$STAGE/tarball/Synara"
            mkdir -p "$STAGE/tarball"
            cp -a "$image" "$copy"
            set_install_channel "$copy/lib/app/Synara.cfg" tarball
            (cd "$STAGE/tarball" && tar -czf "$tarball" Synara)
            rm -rf "$STAGE/tarball"
          }

          make_tarball "$APP_IMAGE" "$ROOT/Synara-linux-x64.tar.gz"
          make_tarball "$CLASSIC_IMAGE" "$ROOT/ClassicApp-linux-x64.tar.gz"

          content_hash() {
            (cd "$1" && find . \( -type f -o -type l \) -print0 | LC_ALL=C sort -z | while IFS= read -r -d '' f; do
              if [ -L "$f" ]; then
                printf 'L %s %s\n' "$f" "$(readlink "$f")"
              else
                printf 'F %s %s %s\n' "$f" "$(stat -c %a "$f")" "$(sha256sum < "$f" | cut -d' ' -f1)"
              fi
            done | sha256sum | cut -d' ' -f1)
          }

          make_pkg() {
            local name=$1 ver=$2 desc=$3 stage=$4
            shift 4
            local depends=() optdepends=() provides=() conflicts=()
            while [ $# -gt 0 ]; do
              case "$1" in
                --optdepend) optdepends+=("$2"); shift 2 ;;
                --provides) provides+=("$2"); shift 2 ;;
                --conflicts) conflicts+=("$2"); shift 2 ;;
                *) depends+=("$1"); shift ;;
              esac
            done
            local file="$name-$ver-1-x86_64.pkg.tar.zst"
            local entries size
            mapfile -t entries < <(cd "$stage" && find . -mindepth 1 -maxdepth 1 ! -name '.*' -printf '%P\n' | LC_ALL=C sort)
            size=$(cd "$stage" && du -sb "${entries[@]}" | awk '{s+=$1} END {print s+0}')
            {
              echo "pkgname = $name"
              echo "pkgbase = $name"
              echo "pkgver = $ver-1"
              echo "pkgdesc = $desc"
              echo "url = https://github.com/$REPO"
              echo "builddate = $(date +%s)"
              echo "packager = GitHub Actions"
              echo "size = $size"
              echo "arch = x86_64"
              echo "license = custom"
              local entry
              for entry in "${depends[@]}"; do echo "depend = $entry"; done
              for entry in "${optdepends[@]}"; do echo "optdepend = $entry"; done
              for entry in "${conflicts[@]}"; do echo "conflict = $entry"; done
              for entry in "${provides[@]}"; do echo "provides = $entry"; done
            } > "$stage/.PKGINFO"
            local meta=(.PKGINFO)
            [ -f "$stage/.INSTALL" ] && meta+=(.INSTALL)
            (cd "$stage" && tar --owner=0 --group=0 --numeric-owner --sort=name -I 'zstd -19 -T0' -cf "$OUT/$file" "${meta[@]}" "${entries[@]}")
            echo "Built $file"
          }

          PKG_VER=
          reuse_or_build() {
            local name=$1 desc=$2 stage=$3 hash prev_hash prev_file
            shift 3
            hash=$(content_hash "$stage")
            if [ $# -gt 0 ]; then
              hash=$(printf '%s\n' "$hash" "$@" | sha256sum | cut -d' ' -f1)
            fi
            if gh release download latest-dev --repo "$REPO" --pattern "$name.sha256" --dir "$PREV" --clobber 2>/dev/null; then
              read -r prev_hash prev_file < "$PREV/$name.sha256" || true
              if [ "${prev_hash:-}" = "$hash" ] && [[ "${prev_file:-}" =~ ^${name}-([0-9]{8}\.[0-9]{6})-1-x86_64\.pkg\.tar\.zst$ ]]; then
                local prev_ver=${BASH_REMATCH[1]}
                if gh release download latest-dev --repo "$REPO" --pattern "$prev_file" --dir "$PREV" --clobber 2>/dev/null \
                  && tar -I zstd -xOf "$PREV/$prev_file" .PKGINFO | grep -xF "pkgname = $name" > /dev/null; then
                  mv "$PREV/$prev_file" "$OUT/"
                  echo "$prev_file" >> "$OUT/reused-packages.txt"
                  PKG_VER=$prev_ver
                  echo "Reusing $prev_file"
                  return
                fi
              fi
            fi
            PKG_VER=$STAMP
            make_pkg "$name" "$PKG_VER" "$desc" "$stage" "$@"
            printf '%s %s\n' "$hash" "$name-$PKG_VER-1-x86_64.pkg.tar.zst" > "$OUT/$name.sha256"
          }

          APP_RUNTIME_HASH=$(content_hash "$APP_IMAGE/lib/runtime")
          CLASSIC_RUNTIME_HASH=$(content_hash "$CLASSIC_IMAGE/lib/runtime")
          if [ "$APP_RUNTIME_HASH" != "$CLASSIC_RUNTIME_HASH" ]; then
            echo "::error::The classic runtime ($CLASSIC_RUNTIME_HASH) differs from the app runtime ($APP_RUNTIME_HASH), synara-runtime cannot be shared"
            diff <(cd "$APP_IMAGE/lib/runtime" && find . -type f -exec sha256sum {} + | LC_ALL=C sort -k2) \
              <(cd "$CLASSIC_IMAGE/lib/runtime" && find . -type f -exec sha256sum {} + | LC_ALL=C sort -k2) || true
            exit 1
          fi

          mkdir -p "$STAGE/runtime/usr/lib/synara-runtime"
          cp -a "$APP_IMAGE/lib/runtime/." "$STAGE/runtime/usr/lib/synara-runtime/"
          reuse_or_build synara-runtime "Java runtime for Synara" "$STAGE/runtime" --provides synara-jre=21

          mkdir -p "$STAGE/runtime-system/usr/lib"
          ln -s /usr/lib/jvm/java-21-openjdk "$STAGE/runtime-system/usr/lib/synara-runtime"
          reuse_or_build synara-runtime-system "Java runtime for Synara from the system jre21-openjdk" "$STAGE/runtime-system" \
            jre21-openjdk --provides synara-jre=21 --conflicts synara-runtime

          icon_members() {
            local f
            for f in "$1"/*.jar; do
              if [[ "$(basename "$f")" == icons-*.jar ]] || [ "$(unzip -Z1 "$f" | grep -cxF 'icons/PhIcons.class')" != 0 ]; then
                basename "$f"
              fi
            done | LC_ALL=C sort
          }

          native_members() {
            local f base
            for f in "$1"/*; do
              base=$(basename "$f")
              case "$base" in
                libskiko-linux-x64.so|libskiko-linux-x64.so.sha256|sqlite-jdbc-*.jar|zstd-jni-*.jar|jna-[0-9]*.jar|lwjgl-*natives-linux*.jar)
                  echo "$base"
                  ;;
                library-jvm-*.jar)
                  if [ "$(unzip -Z1 "$f" | grep -cE '^dev/toastbits/mediasession/|libSMTCAdapter\.dll$')" != 0 ]; then
                    echo "$base"
                  fi
                  ;;
              esac
            done | LC_ALL=C sort
          }

          require_members() {
            local label=$1 members=$2 pattern
            shift 2
            for pattern in "$@"; do
              if ! grep -qE "$pattern" <<< "$members"; then
                echo "::error::$label has no member matching $pattern"
                exit 1
              fi
            done
          }

          member_hashes() {
            local dir=$1 member
            shift
            for member in "$@"; do
              printf '%s %s\n' "$(sha256sum < "$dir/$member" | cut -d' ' -f1)" "$member"
            done
          }

          ICON_PATTERNS=('^icons-material-symbols-.*\.jar$' '^icons-lucide-.*\.jar$' '^library-jvm-.*\.jar$')
          NATIVE_PATTERNS=('^libskiko-linux-x64\.so$' '^libskiko-linux-x64\.so\.sha256$' '^sqlite-jdbc-.*\.jar$' '^zstd-jni-.*\.jar$' \
            '^jna-[0-9].*\.jar$' '^library-jvm-.*\.jar$' '^lwjgl-.*natives-linux.*\.jar$')

          mapfile -t ICON_FILES < <(icon_members "$APP_IMAGE/lib/app")
          mapfile -t CLASSIC_ICON_FILES < <(icon_members "$CLASSIC_IMAGE/lib/app")
          require_members "The app icons" "$(printf '%s\n' "${ICON_FILES[@]}")" "${ICON_PATTERNS[@]}"
          require_members "The classic icons" "$(printf '%s\n' "${CLASSIC_ICON_FILES[@]}")" "${ICON_PATTERNS[@]}"
          if ! diff <(member_hashes "$APP_IMAGE/lib/app" "${ICON_FILES[@]}") <(member_hashes "$CLASSIC_IMAGE/lib/app" "${CLASSIC_ICON_FILES[@]}"); then
            echo "::error::The classic icon jars differ from the app icon jars, synara-icons cannot be shared"
            exit 1
          fi

          mapfile -t APP_NATIVE_FILES < <(native_members "$APP_IMAGE/lib/app")
          mapfile -t CLASSIC_NATIVE_FILES < <(native_members "$CLASSIC_IMAGE/lib/app")
          require_members "The app natives" "$(printf '%s\n' "${APP_NATIVE_FILES[@]}")" "${NATIVE_PATTERNS[@]}"
          require_members "The classic natives" "$(printf '%s\n' "${CLASSIC_NATIVE_FILES[@]}")" "${NATIVE_PATTERNS[@]}"
          mapfile -t NATIVE_FILES < <(LC_ALL=C comm -12 <(printf '%s\n' "${APP_NATIVE_FILES[@]}") <(printf '%s\n' "${CLASSIC_NATIVE_FILES[@]}"))
          echo "Native files only one edition has, they stay in its libs package:"
          LC_ALL=C comm -3 <(printf '%s\n' "${APP_NATIVE_FILES[@]}") <(printf '%s\n' "${CLASSIC_NATIVE_FILES[@]}")
          if ! diff <(member_hashes "$APP_IMAGE/lib/app" "${NATIVE_FILES[@]}") <(member_hashes "$CLASSIC_IMAGE/lib/app" "${NATIVE_FILES[@]}"); then
            echo "::error::The classic native files differ from the app native files, synara-natives cannot be shared"
            exit 1
          fi

          mkdir -p "$STAGE/icons/usr/lib/synara-icons" "$STAGE/natives/usr/lib/synara-natives"
          for member in "${ICON_FILES[@]}"; do
            cp -a "$APP_IMAGE/lib/app/$member" "$STAGE/icons/usr/lib/synara-icons/"
          done
          for member in "${NATIVE_FILES[@]}"; do
            cp -a "$APP_IMAGE/lib/app/$member" "$STAGE/natives/usr/lib/synara-natives/"
          done
          reuse_or_build synara-icons "Icons for Synara" "$STAGE/icons"
          ICONS_VER=$PKG_VER
          reuse_or_build synara-natives "Native libraries for Synara" "$STAGE/natives"
          NATIVES_VER=$PKG_VER

          build_edition() {
            local image=$1 pkg=$2 libs_pkg=$3 dir=$4 icon=$5 name=$6 desc=$7
            local app_stage="$STAGE/$pkg" libs_stage="$STAGE/$libs_pkg"
            mkdir -p "$app_stage/opt/$dir" "$libs_stage/opt/$dir/lib/app"
            cp -a "$image/." "$app_stage/opt/$dir/"
            set_install_channel "$app_stage/opt/$dir/lib/app/Synara.cfg" pacman
            rm -rf "$app_stage/opt/$dir/lib/runtime"
            ln -s /usr/lib/synara-runtime "$app_stage/opt/$dir/lib/runtime"

            local entry base
            for entry in "$app_stage/opt/$dir/lib/app"/* "$app_stage/opt/$dir/lib/app"/.[!.]*; do
              [ -e "$entry" ] || [ -L "$entry" ] || continue
              base=$(basename "$entry")
              if [[ "$base" =~ $OWN_JAR_RE ]] || [[ "$base" == *.cfg ]] || [ "$base" = resources ] \
                || [ "$base" = .jpackage.xml ] || [[ "$base" == skiko-awt-runtime-*.jar ]]; then
                continue
              fi
              mv "$entry" "$libs_stage/opt/$dir/lib/app/"
            done
            echo "Own files of $pkg in lib/app:"
            ls -1A "$app_stage/opt/$dir/lib/app"

            local member
            for member in "${ICON_FILES[@]}"; do
              rm "$libs_stage/opt/$dir/lib/app/$member"
              ln -s "/usr/lib/synara-icons/$member" "$libs_stage/opt/$dir/lib/app/$member"
            done
            for member in "${NATIVE_FILES[@]}"; do
              rm "$libs_stage/opt/$dir/lib/app/$member"
              ln -s "/usr/lib/synara-natives/$member" "$libs_stage/opt/$dir/lib/app/$member"
            done

            reuse_or_build "$libs_pkg" "Third-party libraries for $desc" "$libs_stage"
            local libs_ver=$PKG_VER

            mkdir -p "$app_stage/usr/share/applications" "$app_stage/usr/share/icons/hicolor/scalable/apps" "$app_stage/usr/share/pixmaps"
            cp "$ICON_SVG" "$app_stage/usr/share/icons/hicolor/scalable/apps/$icon.svg"
            cp "$ICON_PNG" "$app_stage/usr/share/pixmaps/$icon.png"
            local size
            for size in 16 24 32 48 64 96 128 256 512 1024; do
              mkdir -p "$app_stage/usr/share/icons/hicolor/${size}x${size}/apps"
              convert "$ICON_PNG" -resize ${size}x${size} "$app_stage/usr/share/icons/hicolor/${size}x${size}/apps/$icon.png"
            done

            cat <<EOF > "$app_stage/usr/share/applications/$icon.desktop"
          [Desktop Entry]
          Name=$name
          Comment=$desc
          Exec=/opt/$dir/bin/Synara
          Icon=$icon
          Terminal=false
          Type=Application
          Categories=Audio;Music;Player;
          EOF

            cat <<'EOF' > "$app_stage/.INSTALL"
          post_install() {
            if command -v update-desktop-database > /dev/null; then
              update-desktop-database -q
            fi
            if command -v gtk-update-icon-cache > /dev/null; then
              gtk-update-icon-cache -q -t -f usr/share/icons/hicolor
            fi
          }
          post_upgrade() {
            post_install
          }
          post_remove() {
            post_install
          }
          EOF

            make_pkg "$pkg" "$APP_PKGVER" "$desc" "$app_stage" "synara-jre=21" "synara-icons=$ICONS_VER" "synara-natives=$NATIVES_VER" "$libs_pkg=$libs_ver" \
              libxtst libxi ttf-font \
              --optdepend "desktop-file-utils: update the desktop entry database" \
              --optdepend "gtk-update-icon-cache: refresh the icon cache"
          }

          build_edition "$APP_IMAGE" synara synara-libs synara synara "Synara" "Synara Music Player"
          build_edition "$CLASSIC_IMAGE" synara-classic synara-classic-libs synara-classic synara-classic "Synara (Classic)" "Synara Music Player (Classic)"

          for f in "$OUT"/*.pkg.tar.zst; do
            tar -I zstd -tf "$f" | grep -v '/$' | grep -v '^\.[A-Z]*$' | sed "s|\$| $(basename "$f")|"
          done > "$STAGE/owned-files.txt"
          DUPLICATES=$(cut -d' ' -f1 "$STAGE/owned-files.txt" | LC_ALL=C sort | uniq -d)
          if [ -n "$DUPLICATES" ]; then
            echo "::error::Files owned by more than one Arch package:"
            echo "$DUPLICATES"
            exit 1
          fi
          ls -l "$OUT"

      - name: Collect Artifacts
        shell: bash
        run: |
          mkdir artifacts
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp app/build/compose/binaries/main/msi/*.msi artifacts/Synara-windows-x64.msi || true
            cp classic/build/compose/binaries/main/msi/*.msi artifacts/ClassicApp-windows-x64.msi || true
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            cp app/build/compose/binaries/main/dmg/*.dmg artifacts/Synara-macos-arm64.dmg || true
            cp classic/build/compose/binaries/main/dmg/*.dmg artifacts/ClassicApp-macos-arm64.dmg || true
          elif [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            cp app/build/compose/binaries/main/deb/*.deb artifacts/Synara-linux-x64.deb || true
            cp classic/build/compose/binaries/main/deb/*.deb artifacts/ClassicApp-linux-x64.deb || true
            if [ -f Synara-linux-x64.tar.gz ]; then mv Synara-linux-x64.tar.gz artifacts/; fi
            if [ -f ClassicApp-linux-x64.tar.gz ]; then mv ClassicApp-linux-x64.tar.gz artifacts/; fi
            if [ -d arch-out ]; then mv arch-out/* artifacts/; fi
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-${{ matrix.os }}
          path: artifacts/
          retention-days: 1

  release:
    name: Create/Update Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: all-artifacts
          merge-multiple: true

      - name: Read Release Version
        id: version
        run: |
          set -euo pipefail
          RELEASE_VERSION=$(tr -d '\r\n' < all-artifacts/release-version.txt)
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Arch Linux Repository Database
        run: |
          set -euo pipefail
          cd all-artifacts
          docker run --rm -v $(pwd):/repo archlinux:base bash -c "cd /repo && repo-add synara.db.tar.gz *.pkg.tar.zst"
          
          rm -f synara.db synara.files
          cp synara.db.tar.gz synara.db
          cp synara.files.tar.gz synara.files

          ls -1 *.pkg.tar.zst > "$RUNNER_TEMP/keep-packages.txt"
          mkdir -p reused
          if [ -f reused-packages.txt ]; then
            while IFS= read -r pkg; do
              [ -n "$pkg" ] && mv "$pkg" reused/
            done < reused-packages.txt
          fi

          cat <<EOF > synara.conf
          [synara]
          SigLevel = Optional TrustAll
          Server = https://github.com/${{ github.repository }}/releases/download/latest-dev
          EOF

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-dev
          name: Latest Development Build
          body: |
            Automated build from the latest commit on `master`.
            
            This release is updated on every push to the `master` branch.
            
            ### Arch Linux Repository
            To use this release as a pacman repository, add the following to your `/etc/pacman.conf`:
            ```ini
            [synara]
            SigLevel = Optional TrustAll
            Server = https://github.com/${{ github.repository }}/releases/download/latest-dev
            ```
            Alternatively, download `synara.conf` and use `Include = /path/to/synara.conf`.
          prerelease: true
          files: |
            all-artifacts/Synara-windows-x64.msi
            all-artifacts/ClassicApp-windows-x64.msi
            all-artifacts/Synara-macos-arm64.dmg
            all-artifacts/ClassicApp-macos-arm64.dmg
            all-artifacts/Synara-linux-x64.deb
            all-artifacts/ClassicApp-linux-x64.deb
            all-artifacts/Synara-linux-x64.tar.gz
            all-artifacts/ClassicApp-linux-x64.tar.gz
            all-artifacts/*.pkg.tar.zst
            all-artifacts/*.sha256
            all-artifacts/synara.db
            all-artifacts/synara.db.tar.gz
            all-artifacts/synara.files
            all-artifacts/synara.files.tar.gz
            all-artifacts/synara.conf
          generate_release_notes: true
          make_latest: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove Stale Arch Packages
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release view latest-dev --repo "$REPO" --json assets --jq '.assets[].name' | while IFS= read -r asset; do
            case "$asset" in
              *.pkg.tar.zst)
                if ! grep -qxF "$asset" "$RUNNER_TEMP/keep-packages.txt"; then
                  echo "Deleting stale asset $asset"
                  gh release delete-asset latest-dev "$asset" --repo "$REPO" --yes
                fi
                ;;
            esac
          done

      - name: Prepare Versioned Release
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="v$RELEASE_VERSION"
          BASE_URL="https://github.com/$REPO/releases/download/$TAG"
          mkdir versioned

          for f in all-artifacts/Synara-* all-artifacts/ClassicApp-*; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            case "$name" in
              *.pkg.tar.zst) continue ;;
            esac
            cp "$f" "versioned/$(echo "$name" | sed -E "s/^(Synara|ClassicApp)-/\1-$RELEASE_VERSION-/")"
          done

          cp all-artifacts/*.pkg.tar.zst versioned/
          if [ -d all-artifacts/reused ]; then
            find all-artifacts/reused -maxdepth 1 -name '*.pkg.tar.zst' -exec cp {} versioned/ \;
          fi

          for pkg in synara-runtime synara-runtime-system synara-icons synara-natives synara-libs synara-classic-libs synara synara-classic; do
            [ "$(ls versioned/ | grep -cE "^$pkg-[^-]+-1-x86_64\.pkg\.tar\.zst$")" = 1 ] || { echo "::error::Expected exactly one $pkg package in versioned/"; exit 1; }
          done

          docker run --rm -v "$(pwd)/versioned":/repo archlinux:base bash -c "cd /repo && repo-add synara.db.tar.gz *.pkg.tar.zst"
          rm -f versioned/synara.db versioned/synara.files
          cp versioned/synara.db.tar.gz versioned/synara.db
          cp versioned/synara.files.tar.gz versioned/synara.files

          cat <<EOF > versioned/synara.conf
          [synara]
          SigLevel = Optional TrustAll
          Server = $BASE_URL
          EOF

          pkg_url() {
            echo "$BASE_URL/$(ls versioned/ | grep -E "^$1-[^-]+-1-x86_64\.pkg\.tar\.zst$")"
          }

          {
            echo "Synara $RELEASE_VERSION. This release is updated on every push to \`master\` while this version is current."
            echo
            echo "### Arch Linux Repository"
            echo "Add the following to your \`/etc/pacman.conf\`:"
            echo '```ini'
            echo "[synara]"
            echo "SigLevel = Optional TrustAll"
            echo "Server = $BASE_URL"
            echo '```'
            echo
            echo "Or install the packages directly, with the bundled Java runtime:"
            echo '```sh'
            echo "sudo pacman -U $(pkg_url synara-runtime) $(pkg_url synara-icons) $(pkg_url synara-natives) $(pkg_url synara-libs) $(pkg_url synara)"
            echo "sudo pacman -U $(pkg_url synara-runtime) $(pkg_url synara-icons) $(pkg_url synara-natives) $(pkg_url synara-classic-libs) $(pkg_url synara-classic)"
            echo '```'
            echo
            echo "Or with the system Java runtime, which needs \`jre21-openjdk\` from the official repositories:"
            echo '```sh'
            echo "sudo pacman -U $(pkg_url synara-runtime-system) $(pkg_url synara-icons) $(pkg_url synara-natives) $(pkg_url synara-libs) $(pkg_url synara)"
            echo "sudo pacman -U $(pkg_url synara-runtime-system) $(pkg_url synara-icons) $(pkg_url synara-natives) $(pkg_url synara-classic-libs) $(pkg_url synara-classic)"
            echo '```'
          } > "$RUNNER_TEMP/versioned-body.md"

          ls -1 versioned > "$RUNNER_TEMP/keep-versioned.txt"
          ls -l versioned

      - name: Create or Update Versioned Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.release_version }}
          name: Synara ${{ steps.version.outputs.release_version }}
          body_path: ${{ runner.temp }}/versioned-body.md
          prerelease: true
          make_latest: false
          files: versioned/*
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove Stale Versioned Assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: v${{ steps.version.outputs.release_version }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' | while IFS= read -r asset; do
            if ! grep -qxF "$asset" "$RUNNER_TEMP/keep-versioned.txt"; then
              echo "Deleting stale asset $asset"
              gh release delete-asset "$TAG" "$asset" --repo "$REPO" --yes
            fi
          done
